# Release desktop installers (LoongArch64 fork)
#
# This fork builds DSH Desktop for LoongArch64 on a real loong64 machine
# (scripts/verify-target.mjs refuses to package on any other platform, and the
# committed electron mirror only carries linux-loong64 artifacts). GitHub-hosted
# runners therefore do NOT build installers here.
#
# What this workflow does:
#   - `ci`   runs npm ci / test / typecheck on GitHub (quality gate for PRs).
#            The committed electron mirror (darkyzhou, loong64-only) is used
#            everywhere; the postinstall skips the electron binary download on
#            non-loongarch64 hosts, so hosted x64 runners never need x64
#            electron artifacts.
#   - `publish` creates/updates the GitHub Release for a `v*` tag (or a tag
#            passed via workflow_dispatch), then mirrors whatever assets are
#            attached to Tencent COS when COS secrets are configured.
#
# Release flow:
#   1. Push a `v*` tag -> this workflow creates the (initially empty) Release.
#   2. On the loong64 machine: npm ci && npm run package:linux:loong64, then
#        gh release upload <tag> dist/dsh-desktop-linux-loong64.deb
#   3. Re-run this workflow (workflow_dispatch, release_tag=<tag>) to mirror
#      the attached assets to COS.
name: Release desktop installers

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - loong64
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing tag to (re)publish after attaching the loong64 .deb
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  publish:
    name: Publish GitHub Release (loong64)
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already exists; leaving assets untouched."
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --generate-notes \
              --title "DSH Desktop $RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
            echo "::notice::Created release $RELEASE_TAG."
          fi

      - name: Check attached assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          names="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if [ -n "$names" ]; then
            echo "attached=yes" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$names" | while read -r name; do echo "  - $name"; done
          else
            echo "attached=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror release assets to Tencent COS
        if: steps.assets.outputs.attached == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$COS_SECRET_ID" && test -n "$COS_SECRET_KEY" && test -n "$COS_BUCKET" || {
            echo "::notice::COS_SECRET_ID/COS_SECRET_KEY/COS_BUCKET not configured; skipping COS mirror."
            exit 0
          }
          gh release download "$RELEASE_TAG" --dir release-assets --repo "$GITHUB_REPOSITORY"
          curl -sSfL -o coscli https://github.com/tencentyun/coscli/releases/download/v1.0.8/coscli-v1.0.8-linux-amd64
          chmod +x coscli
          cat > "$HOME/.cos.yaml" <<YAML
          cos:
            base:
              secretid: ${COS_SECRET_ID}
              secretkey: ${COS_SECRET_KEY}
              sessiontoken: ""
              protocol: https
            buckets:
            - name: ${COS_BUCKET}
              endpoint: cos.accelerate.myqcloud.com
              accelerate: true
              alias: ""
          YAML
          chmod 600 "$HOME/.cos.yaml"
          ./coscli cp release-assets/ "cos://${COS_BUCKET}/releases/latest/" -r --routines 10 --thread-num 8 --long-links-nums 20 --disable-crc64

      - name: Report missing loong64 installer
        if: steps.assets.outputs.attached == 'no'
        run: |
          echo "::warning::Release ${{ steps.tag.outputs.tag }} has no assets yet."
          echo "The LoongArch64 installer must be built on a loong64 machine (not on GitHub runners):"
          echo "  npm ci && npm run package:linux:loong64   # requires fpm (gem install fpm) on the loong64 host"
          echo "Then attach the installer to this release:"
          echo "  gh release upload ${{ steps.tag.outputs.tag }} dist/dsh-desktop-linux-loong64.deb --repo $GITHUB_REPOSITORY"
          echo "Finally re-run this workflow (workflow_dispatch, release_tag=${{ steps.tag.outputs.tag }}) to mirror assets to COS."
