name: Release Linux installers

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x64:
    name: Linux x64
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libfuse3-3 libsecret-1-dev
      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${{ github.ref_name }}"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build Linux x64 package
        run: npm run package:linux:x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/dsh-desktop-linux-x64.deb
            dist/dsh-desktop-linux-x64.AppImage
          if-no-files-found: error

  linux-arm64:
    name: Linux arm64
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libfuse3-3 libsecret-1-dev
      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${{ github.ref_name }}"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build Linux arm64 package
        run: npm run package:linux:arm64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            dist/dsh-desktop-linux-arm64.deb
            dist/dsh-desktop-linux-arm64.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.linux-x64.result == 'success' &&
      needs.linux-arm64.result == 'success'
    needs:
      - linux-x64
      - linux-arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "DSH Desktop $RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
